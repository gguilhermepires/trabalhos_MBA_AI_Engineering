AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Aula 1 - a MESMA VM do Terraform (lab/terraform), agora em CloudFormation,
  o IaC nativo da AWS. Use para comparar as duas sintaxes lado a lado.

Parameters:
  VmName:
    Type: String
    Default: vm-lab-aula01-cfn
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.nano, t3.micro, t3.small, t3.medium]
  KeyName:
    Description: Key pair existente (no Learner Lab, a vockey já existe)
    Type: AWS::EC2::KeyPair::KeyName
    Default: vockey
  SshCidr:
    Description: CIDR liberado para SSH, ex. 203.0.113.10/32 (sem default de propósito - nunca 0.0.0.0/0)
    Type: String
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/32$'
    ConstraintDescription: Informe um único IPv4 no formato x.x.x.x/32
  AppPort:
    Description: Porta da futura camada de aplicação (aceita só do SG da VM)
    Type: Number
    Default: 8080
  # A AMI vem de um parâmetro público mantido pela Canonical no SSM
  UbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id

Resources:
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH, HTTP e HTTPS para a VM do lab da Aula 1
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref SshCidr }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
      Tags:
        - { Key: aula, Value: "1" }
        - { Key: disciplina, Value: cloud-cognitive }
        - { Key: projeto, Value: quantum-commerce }
        - { Key: provisionado, Value: cloudformation }

  # 3.1 em CloudFormation: sg-app aceita AppPort apenas vindo do SG da VM
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Camada de aplicacao - porta restrita ao SG da VM
      Tags:
        - { Key: aula, Value: "1" }
        - { Key: disciplina, Value: cloud-cognitive }
        - { Key: projeto, Value: quantum-commerce }
        - { Key: provisionado, Value: cloudformation }

  AppIngressFromVm:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt AppSecurityGroup.GroupId
      SourceSecurityGroupId: !GetAtt WebSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: !Ref AppPort
      ToPort: !Ref AppPort
      Description: App vinda do SG da VM

  Vm:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref UbuntuAmi
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SecurityGroupIds: [!GetAtt WebSecurityGroup.GroupId]
      MetadataOptions:
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: { VolumeType: gp3, VolumeSize: 8, Encrypted: true }
      Tags:
        - { Key: Name, Value: !Ref VmName }
        - { Key: aula, Value: "1" }
        - { Key: disciplina, Value: cloud-cognitive }
        - { Key: projeto, Value: quantum-commerce }
        - { Key: provisionado, Value: cloudformation }

Outputs:
  AppSecurityGroupId:
    Value: !GetAtt AppSecurityGroup.GroupId
  PublicIp:
    Value: !GetAtt Vm.PublicIp
  SshCommand:
    Description: Conexão a partir do CloudShell (baixe o labsuser.pem do Learner Lab)
    Value: !Sub "ssh -i ~/labsuser.pem ubuntu@${Vm.PublicIp}"
